name: CI

permissions: {}

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: '0.12.18'
    - name: Cache prek
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/prek
        key: prek-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          prek-
    # ty resolves third-party imports from the environment, so jax has to be installed.
    - name: Install dependencies
      run: uv sync --locked --no-default-groups --group lint
    - name: Run pre-commit
      run: uv run --no-sync prek run --all-files --show-diff-on-failure --color always

  test:
    name: Run tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.18'
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: uv build --wheel

      - name: Install project's wheel and dependencies
        run: |
          uv sync --locked --no-install-project
          uv pip install dist/fastquat-*.whl

      - name: Run tests
        run: uv run --no-sync pytest -v
